# Plano, Texas — Residential In-Ground Swimming Pool Permit Checklist
#
# These values are a hand-curated snapshot. URLs, fees, and timelines
# change. The last_verified_date gates staleness checks in the UI;
# do not bump it without re-verifying each permit with the issuing
# office directly.
#
# Source references consulted at last verification:
#   * City of Plano Building Inspections — residential pool permit
#   * Texas Health & Safety Code, Chapter 757 (Pool Yard Enclosure Act)
#   * 2021 International Residential Code (IRC) Appendix V, as adopted
#   * City of Plano Electrical / Plumbing permit schedules

jurisdiction_name: "City of Plano, Texas"
state: "TX"
last_verified_date: "2026-04-15"
statutory_notes:
  - "Texas Health & Safety Code §757 requires a compliant pool yard enclosure (minimum 48-inch barrier, self-closing and self-latching gates) for any pool capable of holding water ≥18 inches deep."
  - "2021 IRC Appendix V (adopted by Plano) imposes additional alarm and barrier requirements for residential pools and spas."
  - "Homeowners inside an HOA must verify Architectural Review Committee approval before permit submittal. Plano does not enforce HOA CC&Rs."

permits:
  - id: residential_building_pool
    name: "Residential Swimming Pool Building Permit"
    issuing_office: "City of Plano — Building Inspections"
    est_cost_usd: 275.0
    est_processing_days: 10
    application_url: "https://www.plano.gov/243/Building-Inspections"
    prefilled_form_url: null
    required_attachments:
      - "Site plan showing pool, setbacks, easements, equipment location"
      - "Pool engineering / structural drawings stamped by a Texas-licensed engineer if > 24 inches deep"
      - "Contractor's state registration / city registration on file"
      - "Property survey (recent)"
    statutory_basis: "City of Plano Code of Ordinances, Chapter 6 (Buildings)"
    puller: "contractor_typically_pulls"
    notes: "Submit through the Plano ePermits / ProjectDox portal. Plan review may request revisions; count 5–10 extra business days when revisions are needed."

  - id: residential_electrical_pool
    name: "Residential Electrical Permit (Pool Bonding & Equipment)"
    issuing_office: "City of Plano — Building Inspections (Electrical)"
    est_cost_usd: 105.0
    est_processing_days: 5
    application_url: "https://www.plano.gov/243/Building-Inspections"
    prefilled_form_url: null
    required_attachments:
      - "Equipment schedule (pump, heater, light, bonding diagram)"
      - "Licensed master electrician's signed scope"
    statutory_basis: "NEC Article 680; adopted per City of Plano electrical code"
    puller: "contractor_typically_pulls"
    notes: "Equipotential bonding grid required around the pool perimeter per NEC 680.26."

  - id: residential_plumbing_pool
    name: "Residential Plumbing Permit (Pool Fill + Backwash Discharge)"
    issuing_office: "City of Plano — Building Inspections (Plumbing)"
    est_cost_usd: 95.0
    est_processing_days: 5
    application_url: "https://www.plano.gov/243/Building-Inspections"
    prefilled_form_url: null
    required_attachments:
      - "Plumbing scope including backflow prevention device specs"
      - "Discharge location showing compliance with storm sewer / sanitary sewer rules"
    statutory_basis: "UPC as adopted; Plano backflow prevention ordinance"
    puller: "contractor_typically_pulls"
    notes: "Backflow preventer is required on any hose-bib used for pool fill."

  - id: pool_barrier_fence
    name: "Pool Yard Enclosure / Barrier Permit"
    issuing_office: "City of Plano — Building Inspections"
    est_cost_usd: 65.0
    est_processing_days: 7
    application_url: "https://www.plano.gov/243/Building-Inspections"
    prefilled_form_url: null
    required_attachments:
      - "Barrier plan (height, gate locations, latching mechanisms)"
      - "If house wall is part of the barrier: door alarm spec sheets"
    statutory_basis: "Texas Health & Safety Code §757; IRC Appendix V"
    puller: "contractor_typically_pulls"
    notes: "Inspection must be passed before pool is filled. Walk-through gates must open outward from the pool, be self-closing, and self-latching with the latch at least 54 inches above ground."

  - id: spa_permit_addendum
    name: "Spa / Hot Tub Permit Addendum"
    issuing_office: "City of Plano — Building Inspections"
    est_cost_usd: 45.0
    est_processing_days: 3
    application_url: "https://www.plano.gov/243/Building-Inspections"
    prefilled_form_url: null
    required_attachments:
      - "Spa equipment cut sheets"
      - "Lockable safety cover specification (IRC AV105.2)"
    statutory_basis: "IRC Appendix V, Section AV105"
    puller: "contractor_typically_pulls"
    only_if: has_spa
    notes: "Only required when an attached or detached spa is part of the project scope."

  - id: hoa_architectural_review
    name: "HOA Architectural Review Committee Approval"
    issuing_office: "Homeowners Association (varies)"
    est_cost_usd: 50.0
    est_processing_days: 30
    application_url: ""
    prefilled_form_url: null
    required_attachments:
      - "Site plan identical to building permit submittal"
      - "Material / color specifications (coping, deck, fence)"
    statutory_basis: "Recorded CC&Rs of the subdivision"
    puller: "homeowner_pulls"
    only_if: hoa_applies
    notes: "Plano does not enforce HOA CC&Rs, but homeowners remain contractually bound. Start this review in parallel with the city permit — HOAs often run the longest timeline."
