<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Agentic tool-calling loop inside an expert task">
  <defs>
    <filter id="al-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="al-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
    <marker id="al-arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="#0d1017"/>

  <g font-family="'Inter', system-ui, sans-serif" transform="translate(60, 40)">
    <text font-size="12" font-weight="700" fill="#A78BFA" letter-spacing="2">AGENTIC TOOL-CALLING LOOP</text>
    <text y="28" font-size="22" font-weight="700" fill="#FFFFFF">How one expert completes one task</text>
    <text y="48" font-size="13" fill="#8A93A4">Up to 6 iterations · Gemini decides what tool to call · findings persisted as RunSteps</text>
  </g>

  <!-- Task prompt input -->
  <g transform="translate(60, 170)" filter="url(#al-shadow)">
    <rect width="180" height="150" rx="14" fill="#131820" stroke="rgba(6,182,212,0.4)"/>
  </g>
  <g transform="translate(60, 170)" font-family="'Inter', system-ui, sans-serif">
    <text x="16" y="26" font-size="10" font-weight="700" fill="#06B6D4" letter-spacing="1.4">INPUT</text>
    <text x="16" y="54" font-size="14" font-weight="700" fill="#FFFFFF">Task prompt</text>
    <text x="16" y="78" font-size="11" fill="#C7CAD1">dimension + 6 evidence</text>
    <text x="16" y="92" font-size="11" fill="#C7CAD1">categories + tool allow-list</text>
    <text x="16" y="120" font-size="10" fill="#8A93A4" font-style="italic">"Investigate pricing"</text>
    <text x="16" y="134" font-size="10" fill="#8A93A4" font-style="italic">"for dimension X"</text>
  </g>
  <line x1="240" y1="245" x2="280" y2="245" stroke="#A78BFA" stroke-width="2" marker-end="url(#al-arrow)"/>

  <!-- Gemini node -->
  <g transform="translate(290, 170)" filter="url(#al-shadow)">
    <rect width="220" height="150" rx="14" fill="#131820" stroke="#A78BFA" stroke-width="2"/>
  </g>
  <g transform="translate(290, 170)" font-family="'Inter', system-ui, sans-serif">
    <text x="16" y="26" font-size="10" font-weight="700" fill="#A78BFA" letter-spacing="1.4">CORE MODEL</text>
    <g transform="translate(70, 50)">
      <circle r="26" fill="#A78BFA"/>
      <text y="-2" font-size="10" font-weight="700" fill="#0d1017" text-anchor="middle">GEMINI</text>
      <text y="12" font-size="9" font-weight="700" fill="#0d1017" text-anchor="middle">2.5 FLASH</text>
    </g>
    <text x="110" y="108" font-size="11" fill="#FFFFFF" text-anchor="middle">Reason · decide</text>
    <text x="110" y="126" font-size="10" fill="#C7CAD1" text-anchor="middle">function_call or</text>
    <text x="110" y="140" font-size="10" fill="#C7CAD1" text-anchor="middle">final response?</text>
  </g>
  <line x1="510" y1="245" x2="550" y2="245" stroke="#A78BFA" stroke-width="2" marker-end="url(#al-arrow)"/>

  <!-- Tool registry -->
  <g transform="translate(560, 170)" filter="url(#al-shadow)">
    <rect width="340" height="150" rx="14" fill="#131820" stroke="rgba(245,158,11,0.4)"/>
  </g>
  <g transform="translate(560, 170)" font-family="'Inter', system-ui, sans-serif">
    <text x="16" y="26" font-size="10" font-weight="700" fill="#F59E0B" letter-spacing="1.4">TOOL REGISTRY</text>
    <g font-family="'JetBrains Mono', monospace" font-size="10" transform="translate(16, 46)">
      <g>
        <rect width="150" height="22" rx="4" fill="#0d1017" stroke="rgba(245,158,11,0.3)"/>
        <text x="8" y="15" fill="#F59E0B">exa_search</text>
        <text x="140" y="15" text-anchor="end" fill="#8A93A4">neural</text>
      </g>
      <g transform="translate(158, 0)">
        <rect width="150" height="22" rx="4" fill="#0d1017" stroke="rgba(245,158,11,0.3)"/>
        <text x="8" y="15" fill="#F59E0B">gemini_search</text>
        <text x="140" y="15" text-anchor="end" fill="#8A93A4">ground</text>
      </g>
      <g transform="translate(0, 28)">
        <rect width="150" height="22" rx="4" fill="#0d1017" stroke="rgba(245,158,11,0.3)"/>
        <text x="8" y="15" fill="#F59E0B">web_scraper</text>
        <text x="140" y="15" text-anchor="end" fill="#8A93A4">HTML</text>
      </g>
      <g transform="translate(158, 28)">
        <rect width="150" height="22" rx="4" fill="#0d1017" stroke="rgba(245,158,11,0.3)"/>
        <text x="8" y="15" fill="#F59E0B">python_executor</text>
        <text x="140" y="15" text-anchor="end" fill="#8A93A4">compute</text>
      </g>
      <g transform="translate(0, 56)">
        <rect width="150" height="22" rx="4" fill="#0d1017" stroke="rgba(245,158,11,0.3)"/>
        <text x="8" y="15" fill="#F59E0B">voice_caller</text>
        <text x="140" y="15" text-anchor="end" fill="#8A93A4">Twilio</text>
      </g>
      <g transform="translate(158, 28)">
      </g>
      <g transform="translate(158, 56)">
        <rect width="150" height="22" rx="4" fill="#0d1017" stroke="rgba(245,158,11,0.3)"/>
        <text x="8" y="15" fill="#F59E0B">chart_generator</text>
        <text x="140" y="15" text-anchor="end" fill="#8A93A4">visual</text>
      </g>
    </g>
  </g>

  <!-- Feedback loop arrow (tool result back to Gemini) -->
  <g stroke="#F59E0B" stroke-width="2" fill="none">
    <path d="M 730 170 C 730 80, 400 80, 400 155" marker-end="url(#al-arrow-back)"/>
  </g>
  <g font-family="'Inter', system-ui, sans-serif" transform="translate(540, 108)">
    <rect width="140" height="22" rx="11" fill="#F59E0B"/>
    <text x="70" y="15" font-size="10" font-weight="700" fill="#0d1017" text-anchor="middle">tool result · loop</text>
  </g>

  <!-- Output / findings -->
  <g transform="translate(940, 170)" filter="url(#al-shadow)">
    <rect width="200" height="150" rx="14" fill="#131820" stroke="rgba(52,211,153,0.4)"/>
  </g>
  <g transform="translate(940, 170)" font-family="'Inter', system-ui, sans-serif">
    <text x="16" y="26" font-size="10" font-weight="700" fill="#34D399" letter-spacing="1.4">OUTPUT · DB</text>
    <text x="16" y="54" font-size="14" font-weight="700" fill="#FFFFFF">Findings</text>
    <g font-family="'JetBrains Mono', monospace" font-size="10" transform="translate(16, 74)">
      <text y="0" fill="#C7CAD1">type: fact · stat</text>
      <text y="14" fill="#C7CAD1">source: web · voice</text>
      <text y="28" fill="#C7CAD1">confidence: 0.0–1.0</text>
      <text y="42" fill="#C7CAD1">entity_refs: [...]</text>
      <text y="56" fill="#34D399">+ RunStep events →</text>
    </g>
  </g>
  <line x1="900" y1="245" x2="938" y2="245" stroke="#34D399" stroke-width="2" marker-end="url(#al-arrow)"/>

  <!-- Iteration counter -->
  <g transform="translate(60, 360)" font-family="'Inter', system-ui, sans-serif">
    <text font-size="10" font-weight="700" fill="#8A93A4" letter-spacing="1.4">MAX 6 ITERATIONS PER TASK · EXIT WHEN MODEL RETURNS NO FUNCTION_CALL</text>
  </g>
</svg>
